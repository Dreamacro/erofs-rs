[workspace]
members = ["erofs", "erofs-cli"]
resolver = "2"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"

[workspace.dependencies]
anyhow = "1"
binrw = { version = "0.15", default-features = false }
bitflags = "2.13"
bytes = { version = "1", default-features = false }
chrono = { version = "0.4", default-features = false }
clap = { version = "4", default-features = false }
crc32c = { version = "0.6", default-features = false }
lz4_flex = { git = "https://github.com/Dreamacro/lz4_flex", rev = "46f45f2b6e15b9fd0fa3b8614891fb8228fe6e40", default-features = false }
lzma-rust2 = { version = "0.25", default-features = false }
memmap2 = { version = "0.9", default-features = false }
miniz_oxide = { git = "https://github.com/Frommi/miniz_oxide", rev = "b28c237471f63efebe152bddd962dc57bbb531eb", default-features = false }
opendal = { version = "0.59", default-features = false }
rustix = { version = "1", default-features = false }
tar = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false }
typed-path = { version = "0.12", default-features = false }
url = { version = "2", default-features = false }
uuid = { version = "1", default-features = false }
zrip = { version = "0.8", default-features = false, features = ["std", "simd"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
