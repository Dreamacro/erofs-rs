[package]
name = "erofs-rs"
version = "0.3.0"
edition = "2024"
authors = ["Dreamacro"]
description = "A pure Rust library for reading and building EROFS (Enhanced Read-Only File System) images"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dreamacro/erofs-rs"
keywords = ["erofs", "filesystem", "readonly", "linux"]
categories = ["filesystem"]
readme = "../README.md"
rust-version = "1.91"

[lints]
workspace = true

[features]
default = ["std"]
std = [
  "dep:memmap2",
  "thiserror/std",
  "bytes/std",
  "binrw/std",
  "rustix/std",
  "typed-path/std",
]
opendal = ["std", "dep:opendal"]
tokio = ["std", "dep:tokio"]
lz4 = ["dep:lz4_flex"]
lzma = ["std", "dep:lzma-rs"]
deflate = ["dep:miniz_oxide"]
zstd = ["dep:ruzstd"]

[dependencies]
binrw = { workspace = true }
bitflags = { workspace = true }
bytes = { workspace = true }
lz4_flex = { workspace = true, optional = true, features = ["safe-decode", "checked-decode"] }
lzma-rs = { workspace = true, optional = true, features = ["raw_decoder"] }
memmap2 = { workspace = true, default-features = true, optional = true }
miniz_oxide = { workspace = true, optional = true }
opendal = { workspace = true, optional = true }
rustix = { workspace = true, features = ["fs"] }
ruzstd = { workspace = true, optional = true, features = ["hash"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util"] }
typed-path = { workspace = true }
