name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91.0
          components: clippy

      - run: cargo build --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Isolated codec features (only lzma enables std)
        run: |
          for features in '' lz4 lzma deflate zstd lz4,deflate,zstd; do
            cargo test -p erofs-rs --no-default-features --features "$features" --locked
            cargo clippy -p erofs-rs --all-targets --no-default-features --features "$features" --locked -- -D warnings
          done
